name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -count=1 ./...
      - name: Build Windows binary
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path .tmp | Out-Null
          go build -trimpath -ldflags "-s -w -H windowsgui" -o .tmp/GBF-Dock.exe .

  build-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
      - name: Vet (linux)
        run: go vet ./...
      - name: Build (darwin/arm64)
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: go build -trimpath -o /tmp/gbf-dock-darwin .
